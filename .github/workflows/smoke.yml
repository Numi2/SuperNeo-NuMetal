name: Build And Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/smoke.yml"
      - "Package.swift"
      - "Sources/**"
      - "SuperNeo-NuMetal/**"
      - "SuperNeoCLI/**"
      - "SuperNeo-NuMetalTests/**"
      - "Tests/**"
      - "Scripts/**"
      - "Docs/**"
      - "TestVectors/**"
      - "Evidence/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke.yml"
      - "Package.swift"
      - "Sources/**"
      - "SuperNeo-NuMetal/**"
      - "SuperNeoCLI/**"
      - "SuperNeo-NuMetalTests/**"
      - "Tests/**"
      - "Scripts/**"
      - "Docs/**"
      - "TestVectors/**"
      - "Evidence/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and focused smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke check
        run: Scripts/check-smoke.sh
