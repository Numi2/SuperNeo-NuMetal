name: Formal Status

on:
  pull_request:
    paths:
      - "Formal/**"
      - "Docs/FormalStatus.json"
      - "Docs/PaperReproduction.md"
      - "Docs/RoadmapStatus.md"
      - "Docs/WhatThisProves.md"
      - "Docs/FormalVerification.md"
      - "Docs/FormalStatusPromotion-2026-04-13.md"
      - "Scripts/validate-formal-status.py"
      - "Scripts/test-formal-status-validation.py"
      - ".github/workflows/formal-status.yml"
  push:
    branches:
      - main
    paths:
      - "Formal/**"
      - "Docs/FormalStatus.json"
      - "Docs/PaperReproduction.md"
      - "Docs/RoadmapStatus.md"
      - "Docs/WhatThisProves.md"
      - "Docs/FormalVerification.md"
      - "Docs/FormalStatusPromotion-2026-04-13.md"
      - "Scripts/validate-formal-status.py"
      - "Scripts/test-formal-status-validation.py"
      - ".github/workflows/formal-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    name: Lean build and formal status validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Build Lean workspace
        run: |
          cd Formal
          lake build

      - name: Validate formal status manifest
        run: Scripts/validate-formal-status.py

      - name: Regression-test formal status validator
        run: Scripts/test-formal-status-validation.py
