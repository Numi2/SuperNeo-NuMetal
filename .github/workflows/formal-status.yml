name: Formal Status Manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: Lean formal validation manual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Build Lean workspace
        run: |
          cd Formal
          lake build

      - name: Run formal executable checks
        run: |
          cd Formal
          lake build SuperNeoFormal.VectorChecks
          lake env lean --run ProofImportWall.lean
          lake env lean --run SuperNeoFormalVectorCheck.lean
